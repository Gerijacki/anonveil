# AnonVeil configuration.
#
# Copy this file to /etc/anonveil/config.toml and edit as needed.
# Every value shown here is the built-in default — an empty or partial
# file is valid; anything you omit falls back to these defaults.

[network]
# Loopback port Tor's TransPort listens on.
trans_port = 9040

# Loopback port Tor's DNSPort listens on. Deliberately not 53: the
# kill switch redirects normal port-53 traffic here, so this must stay
# free for Tor itself to bind.
dns_port = 5353

# Loopback port Tor's ControlPort listens on (cookie-auth only).
control_port = 9051

# "block" (default, recommended) hard-blocks all non-loopback IPv6
# traffic. "route_through_tor" is reserved for a future release and
# currently behaves identically to "block" — see threat-model.md.
ipv6_mode = "block"

# TCP ports on THIS HOST that bypass the kill switch entirely (e.g. an
# admin's own SSH session). Leave empty unless you know you need this —
# every entry here is a deliberate hole in the kill switch.
excluded_tcp_ports = []

# Interfaces that bypass the kill switch's default-deny (e.g. a VPN/mesh
# interface like "tailscale0"). Does NOT exempt the interface from Tor's
# DNS/TCP redirection itself — see threat-model.md for why.
excluded_interfaces = []

# Two-letter country codes (e.g. "us") or relay fingerprints to constrain
# exit circuits to. Empty means Tor's own default selection. Constraining
# this shrinks your anonymity set — see the docs before setting it.
exit_nodes = []

# Country codes/fingerprints exit circuits must avoid.
exclude_exit_nodes = []

# Whether exit_nodes/exclude_exit_nodes is a hard requirement (Tor's
# StrictNodes) rather than a preference. Can mean circuits fail to build
# if too few matching relays are available.
strict_exit_nodes = false

[network.bridges]
# Use pluggable-transport bridges instead of connecting to the public Tor
# network directly. Off by default. Requires obfs4proxy installed.
enabled = false

# Raw "Bridge" lines from https://bridges.torproject.org or a trusted
# contact — AnonVeil never fetches or invents these itself.
lines = []

[mac]
# Randomize the network interface's MAC address every time `anonveil
# start` runs. Off by default — enable deliberately, not as a surprise.
randomize_on_start = false

# Periodic, automatic identity rotation while AnonVeil is active — for
# stronger privacy than the one-shot `newnym`/`mac randomize` alone.
# Both off by default. Driven by `anonveil rotate --watch`, meant to be
# run via the optional `anonveil-rotate.service` (also not enabled by
# default: `sudo systemctl enable --now anonveil-rotate.service`).
# Read threat-model.md's rotation section first — more rotation is not
# automatically more private, and MAC rotation causes a brief
# connectivity interruption every time (it has to bring the interface
# down to change its address).
[rotation.ip]
enabled = false
interval_minutes = 10

[rotation.mac]
enabled = false
interval_minutes = 10

[tui]
# "matrix" (green-on-black) or "cyan".
theme = "matrix"

[logging]
# error | warn | info | debug | trace
level = "info"
