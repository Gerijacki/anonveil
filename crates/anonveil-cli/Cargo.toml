[package]
name = "anonveil-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AnonVeil: a system-wide Tor transparent-proxy and kill switch for Arch and Debian."
default-run = "anonveil"

[[bin]]
name = "anonveil"
path = "src/main.rs"

[dependencies]
anonveil-core = { workspace = true }
anonveil-priv = { workspace = true }
clap = { workspace = true }
clap_complete = "4"
clap_mangen = "0.2"
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
tokio = { workspace = true }
ratatui = "0.30"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[package.metadata.deb]
maintainer = "AnonVeil contributors <anonveil@noreply.github.com>"
copyright = "2026, AnonVeil contributors"
license-file = ["../../LICENSE", "0"]
extended-description = """\
AnonVeil is a system-wide Tor transparent-proxy and kill switch: it \
redirects all outbound traffic through Tor and blocks anything that \
doesn't go through it, so a single command makes the whole host \
anonymous — including .onion sites, which resolve natively once it's \
active. See https://github.com/Gerijacki/anonveil for documentation \
and the threat model."""
depends = "tor, nftables, iproute2"
recommends = "obfs4proxy"
section = "net"
priority = "optional"
maintainer-scripts = "../../packaging/debian"
assets = [
    ["target/release/anonveil", "usr/bin/", "755"],
    ["../../config/config.example.toml", "usr/share/anonveil/config.example.toml", "644"],
    ["../../README.md", "usr/share/doc/anonveil/README.md", "644"],
    ["../../threat-model.md", "usr/share/doc/anonveil/threat-model.md", "644"],
    # Installed but NOT enabled by default — see the unit file's own
    # comments and threat-model.md for why this stays opt-in.
    ["../../packaging/systemd/anonveil.service", "lib/systemd/system/anonveil.service", "644"],
    # Generated by `.github/workflows/release.yml`'s build-deb job (the
    # binary itself generates these — see
    # crates/anonveil-cli/src/commands/{completions,man}.rs — never
    # hand-maintained, so they can't drift from the real CLI).
    ["target/release/anonveil.bash", "usr/share/bash-completion/completions/anonveil", "644"],
    ["target/release/_anonveil", "usr/share/zsh/vendor-completions/_anonveil", "644"],
    ["target/release/anonveil.fish", "usr/share/fish/vendor_completions.d/anonveil.fish", "644"],
    ["target/release/anonveil.1", "usr/share/man/man1/anonveil.1", "644"],
]
