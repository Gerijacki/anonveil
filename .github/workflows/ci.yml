name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: build + test (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --workspace
      - run: cargo test --workspace

  test-arch:
    name: build + test (arch container)
    runs-on: ubuntu-latest
    container: archlinux/archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm rustup git nftables
      - run: rustup default stable
      - uses: actions/checkout@v4
      - run: cargo build --workspace
      - run: cargo test --workspace

  test-integration-privileged:
    name: privileged nftables integration tests
    # Loads/deletes a real firewall table — only run on pushes to main,
    # not on every PR, to keep the privileged-runner surface small.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:base-devel
      options: --privileged --cap-add=NET_ADMIN
    steps:
      - run: pacman -Syu --noconfirm rustup git nftables iproute2
      - run: rustup default stable
      - uses: actions/checkout@v4
      - name: run privileged integration tests
        run: |
          cargo test -p anonveil-priv --features integration -- --test-threads=1
