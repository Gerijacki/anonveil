[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.78"
authors = ["AnonVeil contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/Gerijacki/anonveil"
homepage = "https://github.com/Gerijacki/anonveil"

[workspace.dependencies]
anonveil-core = { path = "crates/anonveil-core", version = "0.1.0" }
anonveil-priv = { path = "crates/anonveil-priv", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "io-util", "macros"] }
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
panic = "abort"
