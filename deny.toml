# cargo-deny configuration. Run locally with `cargo deny check all`;
# enforced in CI by .github/workflows/audit.yml.
#
# AnonVeil is a security tool — the point of this file is to make the
# supply chain itself an explicit, reviewed decision rather than
# whatever `cargo add` happens to pull in.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Deliberately excluded — see anonveil-core::control module docs for
    # why AnonVeil implements the Tor control-port protocol itself
    # instead of depending on either of these.
    { crate = "torut" },
    { crate = "stem-rs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
